name: Deploy tested release demos from main
on:
  workflow_run:
    workflows: ['Validate and release DanceFlow']
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tested immutable release tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: danceflow-pages
  cancel-in-progress: false
jobs:
  pages:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v') && github.event.workflow_run.head_repository.id == github.repository_id)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag || github.event.workflow_run.head_branch }}
      EXPECTED_SOURCE: ${{ github.event.workflow_run.head_sha || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify exact published source, version and archive before staging
        run: python scripts/prepare_pages.py --tag "$RELEASE_TAG" --expected-source "$EXPECTED_SOURCE"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
