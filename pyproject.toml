[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "danceflow-agent-tools"
version = "0.1.20"
description = "Portable skills and a complete DanceFlow ecosystem MCP hub. https://kieransimkin.co.uk/danceflow/"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kieran Simkin" }]
keywords = ["DanceFlow", "music-analysis", "lyric-timing", "lyric-video", "audio-reactive", "bpm-animation", "keyword-research", "image-analysis", "visual-identity", "local-mcp", "agent-skills"]
dependencies = ["mcp>=2.3,<3", "keywordmoves>=0.5.8,<0.6", "jsonschema>=4,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2", "twine>=6", "PyYAML>=6", "tomli>=2; python_version < '3.11'"]

[project.urls]
Homepage = "https://kieransimkin.co.uk/danceflow/"
"Kieran Simkin" = "https://kieransimkin.co.uk/"
Repository = "https://github.com/kieransimkin/DanceFlow"
Issues = "https://github.com/kieransimkin/DanceFlow/issues"
Documentation = "https://github.com/kieransimkin/DanceFlow/tree/main/docs"

[project.scripts]
danceflow-mcp = "danceflow_agents.server:main"
danceflow-agent-tools = "danceflow_agents.server:main"
danceflow-releases = "danceflow_agents.releases:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
danceflow_agents = ["library_bridge.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.data-files]
"share/danceflow-agent-tools" = ["catalogue.json"]
"share/danceflow-agent-tools/docs" = ["docs/ecosystem.md", "docs/mcp-ecosystem.md"]
"share/danceflow-agent-tools/docs/tools" = ["docs/tools/*.md"]
"share/danceflow-agent-tools/plugins/danceflow" = ["plugins/danceflow/.mcp.json", "plugins/danceflow/mcp.json", "plugins/danceflow/plugin.json"]
"share/danceflow-agent-tools/plugins/danceflow/.claude-plugin" = ["plugins/danceflow/.claude-plugin/plugin.json"]
"share/danceflow-agent-tools/plugins/danceflow/.codex-plugin" = ["plugins/danceflow/.codex-plugin/plugin.json"]
